<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sultan Alfaifi">
  <!-- The living orb, held still: dark glass, silk ribbons of the aurora light, a lit rim and its glow. -->
  <defs>
    <linearGradient id="light" x1="0.08" y1="0.1" x2="0.92" y2="0.9">
      <stop offset="0" stop-color="#FF5C8D"/>
      <stop offset="0.3" stop-color="#FFB46A"/>
      <stop offset="0.62" stop-color="#47C8F5"/>
      <stop offset="1" stop-color="#8F6BFF"/>
    </linearGradient>
    <radialGradient id="glow-mask" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.66" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim-mask" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.36" r="0.66">
      <stop offset="0" stop-color="#211A2C"/>
      <stop offset="0.6" stop-color="#0B0A11"/>
      <stop offset="1" stop-color="#151021"/>
    </radialGradient>
    <mask id="glow-m"><circle cx="32" cy="32" r="31" fill="url(#glow-mask)"/></mask>
    <mask id="rim-m"><circle cx="32" cy="32" r="22" fill="url(#rim-mask)"/></mask>
    <filter id="blur-l" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="blur-s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.7"/></filter>
    <clipPath id="sphere"><circle cx="32" cy="32" r="22"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#light)" mask="url(#glow-m)" filter="url(#blur-l)" opacity="0.75"/>
  <circle cx="32" cy="32" r="22" fill="url(#core)"/>
  <g clip-path="url(#sphere)" fill="none" stroke-linecap="round">
    <g filter="url(#blur-l)" opacity="0.45" stroke-width="4">
      <path d="M6 36c8-8 12 1 19-3s8-13 16-11 8 10 17 5" stroke="#47C8F5"/>
      <path d="M10 48c6-5 10 2 16-2s6-9 13-7 8 7 15 1" stroke="#FF5C8D"/>
    </g>
    <g filter="url(#blur-s)">
      <path d="M6 36c8-8 12 1 19-3s8-13 16-11 8 10 17 5" stroke="#9FE3FF" stroke-width="1.5"/>
      <path d="M10 48c6-5 10 2 16-2s6-9 13-7 8 7 15 1" stroke="#FFB3C8" stroke-width="1.3"/>
      <path d="M15 19c5 4 4 10 10 10s8-6 13-3 4 8 10 6" stroke="#FFD3A8" stroke-width="1.1" opacity="0.8"/>
      <path d="M20 41c3-3 6-1 8 1s6 3 9 0" stroke="#C9BEFF" stroke-width="1" opacity="0.7"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="22" fill="url(#light)" mask="url(#rim-m)"/>
  <circle cx="32" cy="32" r="21.6" fill="none" stroke="url(#light)" stroke-width="0.9" opacity="0.9"/>
  <ellipse cx="24.5" cy="22" rx="5" ry="2.6" fill="#FFFAF4" opacity="0.14" transform="rotate(-30 24.5 22)"/>
</svg>
