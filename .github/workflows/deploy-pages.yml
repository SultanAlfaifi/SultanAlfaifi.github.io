name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm ci checks package-lock.json against the npm that runs it, and newer npm releases want
      # optional wasm entries that the lockfile's npm (11.6.1, from local development) does not write.
      - name: Use the npm that wrote package-lock.json
        run: npm install -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate and export
        env:
          NEXT_PUBLIC_SITE_URL: https://SultAlfaifi.com
          # Repository variables (Settings → Secrets and variables → Actions → Variables). Both are public values.
          NEXT_PUBLIC_AGENT_URL: ${{ vars.AGENT_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run check

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
